spring.application.name=backend

# SQLite database
spring.datasource.url=jdbc:sqlite:database/notes.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Security logging
logging.level.org.springframework.security=TRACE

# PDF multipart upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=502MB
spring.servlet.multipart.file-size-threshold=0

# PDF storage directory
notes.storage.directory=storage/pdf

# Initial admin setup: disabled by default
app.admin-setup.enabled=${ADMIN_SETUP_ENABLED:false}
app.admin-setup.secret=${ADMIN_SETUP_SECRET:}